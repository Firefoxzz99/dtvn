[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtvn"
version = "0.1.0"
description = "Network Reconnaissance CLI Toolkit for learning and authorized security assessment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dtvn = "dtvn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]